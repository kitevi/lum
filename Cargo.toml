[package]
name = "lum"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"

[build-dependencies]
jiff = "0.2.37"


[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
dunce = "1.0.5"
ureq = { version = "~3.5.0", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = "0.4.46"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
fs_extra = "1.3.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
volumecontrol = "0.1.4"
which = "8.0.6"
ignore = "0.4.33"
jiff = "0.2.37"
globset = "0.4.20"
notify-rust = "4.18.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
fastrand = "2.5.0"
rayon = "1.12.0"
secrecy = { version = "0.10.3", features = ["serde"] }
url = "2.5.8"
usage = { package = "usage-rs", version = "6.12.0", features = ["completions"] }
gix-credentials = { version = "0.41.0", default-features = false }
gix-error = "0.4.0"

[dev-dependencies]
assert_cmd = "2.2.2"
usage-parser = { package = "usage-lib", version = "6.12.0" }
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
