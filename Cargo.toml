[package]
name = "lum"
version = "0.3.2"
edition = "2024"
rust-version = "1.91"

[build-dependencies]
jiff = "0.2.37"


[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
dunce = "1.0.5"
ureq = { version = "~3.5.0", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = "0.4.46"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
fs_extra = "1.3.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
volumecontrol = "0.1.4"
which = "8.0.6"
ignore = "0.4.33"
jiff = "0.2.37"
globset = "0.4.20"
notify-rust = "4.18.1"
# The radio tray. The `ksni` backend is StatusNotifierItem over D-Bus, so Linux needs no GTK; the
# default backend would make every lum command require libgtk-3 just to start (see ADR-0022).
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Lets the tray kill the ffplay that the supervisor is blocked waiting on.
shared_child = "1.1.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
fastrand = "2.5.0"
rayon = "1.12.0"
secrecy = { version = "0.10.3", features = ["serde"] }
url = "2.5.8"
usage = { package = "usage-rs", version = "6.12.0", features = ["completions"] }
gix-credentials = { version = "0.41.0", default-features = false }
gix-error = "0.4.0"

# `lum net game -- <command>` keeps Ctrl+C, SIGTERM and SIGHUP from killing lum before it switches
# game mode off. Already in the tree through shared_child; `lum net` is Linux and macOS only.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.6", default-features = false }

# Windows and macOS need a native event loop on the tray's thread; the Linux backend runs its own.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

# tray-icon's own examples nudge the main run loop after creating the status item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }

[dev-dependencies]
assert_cmd = "2.2.2"
usage-parser = { package = "usage-lib", version = "6.12.0" }
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
